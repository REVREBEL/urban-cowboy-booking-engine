name = "urban-cowboy-booking-engine"
main = "worker/index.ts"
compatibility_date = "2025-05-01"
# fetch() is global on the Workers runtime — no need for nodejs_compat.

# Static Assets: the built frontend (dist/) is served by the ASSETS binding.
# not_found_handling = SPA → /confirmation and other client routes return index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Safe demo defaults. Production identifiers and integrations must be supplied
# explicitly in the target Cloudflare environment; none are inherited here.
[vars]
MEWS_BASE_URL = "https://api.mews-demo.com"
MEWS_APP_BASE_URL = "https://api.mews-demo.com"
MEWS_HOTEL_ID = "3edbe1b4-6739-40b7-81b3-d369d9469c48"
MEWS_CONFIG_ID = "93e27b6f-cba7-4e0b-a24a-819e1b7b388a"
MEWS_ADULT_AGE_CATEGORY_ID = "5485e2f3-4034-4ca1-8a8f-ade30114c61f"
MEWS_CHILD_AGE_CATEGORY_ID = "fece4b6b-39fa-4ccd-9909-afba0092eeb1"

# Public Webflow identifiers. The API token remains a Worker secret supplied as
# WEBFLOW_CMS_API_TOKEN and is never included in the browser bundle.
WEBFLOW_SITE_ID = "6aaa2497c8ea366207beba30"
WEBFLOW_RATE_CARD_COLLECTION_ID = "6abc811cb92ea32dd64d79e0"
WEBFLOW_ADD_ON_COLLECTION_ID = "6ac364287c8782e8e653075e"

# Tracking is intentionally disabled until Urban Cowboy provisions its own endpoint.


# Calendar snapshot refresh scheduler. The Worker itself enforces America/New_York
# cadence: every 30 minutes during the revenue-management day and hourly 8 PM–7 AM.
[triggers]
crons = ["*/15 * * * *"]

# Preferred production calendar snapshot store. Create the namespace first, then
# uncomment and insert the namespace ID. Until then the Worker falls back to
# Cloudflare's Cache API.
#
# [[kv_namespaces]]
# binding = "CALENDAR_CACHE"
# id = "<cloudflare-kv-namespace-id>"
