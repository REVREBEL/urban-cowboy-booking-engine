name = "urban-cowboy-booking-engine"
main = "worker/index.ts"
compatibility_date = "2025-05-01"
# fetch() is global on the Workers runtime — no need for nodejs_compat.

# Static Assets: the built frontend (dist/) is served by the ASSETS binding.
# not_found_handling = SPA → /confirmation and other client routes return index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Template only. scripts/deploy-worker.mjs reads the shared .env and renders
# these placeholders into .wrangler.generated.toml before deployment.
# NEVER deploy this template directly or put credentials into [vars].
[vars]
MEWS_CLIENT = "__ENV_MEWS_CLIENT__"
MEWS_BASE_URL = "__ENV_MEWS_BASE_URL__"
MEWS_APP_BASE_URL = "__ENV_MEWS_APP_BASE_URL__"
MEWS_HOTEL_ID = "__ENV_MEWS_HOTEL_ID__"
MEWS_CONFIG_ID = "__ENV_MEWS_CONFIG_ID__"
MEWS_ADULT_AGE_CATEGORY_ID = "__ENV_MEWS_ADULT_AGE_CATEGORY_ID__"
MEWS_CHILD_AGE_CATEGORY_ID = "__ENV_MEWS_CHILD_AGE_CATEGORY_ID__"
WEBFLOW_SITE_ID = "__ENV_WEBFLOW_SITE_ID__"
WEBFLOW_RATE_CARD_COLLECTION_ID = "__ENV_WEBFLOW_RATE_CARD_COLLECTION_ID__"
WEBFLOW_CONTENT_SETTINGS_COLLECTION_ID = "__ENV_WEBFLOW_CONTENT_SETTINGS_COLLECTION_ID__"
WEBFLOW_POLICY_LANGUAGE_ITEM_ID = "__ENV_WEBFLOW_POLICY_LANGUAGE_ITEM_ID__"
WEBFLOW_ADD_ON_COLLECTION_ID = "__ENV_WEBFLOW_ADD_ON_COLLECTION_ID__"
WEBFLOW_ROOM_TYPE_COLLECTION_ID = "__ENV_WEBFLOW_ROOM_TYPE_COLLECTION_ID__"
WEBFLOW_LOCATION_COLLECTION_ID = "__ENV_WEBFLOW_LOCATION_COLLECTION_ID__"
WEBFLOW_BUILDING_COLLECTION_ID = "__ENV_WEBFLOW_BUILDING_COLLECTION_ID__"
WEBFLOW_AMENITY_COLLECTION_ID = "__ENV_WEBFLOW_AMENITY_COLLECTION_ID__"
WEBFLOW_PHOTO_HOTSPOT_COLLECTION_ID = "__ENV_WEBFLOW_PHOTO_HOTSPOT_COLLECTION_ID__"
WEBFLOW_LOCATION_ITEM_ID = "__ENV_WEBFLOW_LOCATION_ITEM_ID__"
WEBHOOK_EVENTS = "__ENV_WEBHOOK_EVENTS__"
# Cloudflare Access app that protects the private admin routes. Non-secret
# identifiers; the JWT itself is verified against the team's Access JWKS.
CF_ACCESS_TEAM_DOMAIN = "__ENV_CF_ACCESS_TEAM_DOMAIN__"
CF_ACCESS_AUD = "__ENV_CF_ACCESS_AUD__"
ADMIN_EMAILS = "__ENV_ADMIN_EMAILS__"
ADMIN_GROUPS = "__ENV_ADMIN_GROUPS__"

# Secret binding names are declared here; their values are loaded from .env
# and passed to Wrangler through --secrets-file, never as plaintext vars.
[secrets]
required = ["ADMIN_TOKEN"]

# Tracking is intentionally disabled until Urban Cowboy provisions its own endpoint.


# Calendar snapshot refresh scheduler. The Worker itself enforces America/New_York
# cadence: every 30 minutes during the revenue-management day and hourly 8 PM–7 AM.
[triggers]
crons = ["*/15 * * * *"]

# Preferred production calendar snapshot store. Create the namespace first, then
# uncomment and insert the namespace ID. Until then the Worker falls back to
# Cloudflare's Cache API.
#
# [[kv_namespaces]]
# binding = "CALENDAR_CACHE"
# id = "<cloudflare-kv-namespace-id>"


# Optional shared cache for slow-changing Webflow editorial content.
# Production on Webflow Cloud should provision a Key Value Store with this
# binding name. Leave commented locally until a namespace/store is provisioned.
#
# [[kv_namespaces]]
# binding = "WEBFLOW_CONTENT_CACHE"
# id = "<webflow-content-cache-namespace-id>"

# D1 database: owns editorial content, settings, publishing revisions, stable
# media IDs, merchandising, guest recovery state and reporting read models.
# Provisioned in REVREBEL Cloudflare account. Keep D1 cutover gated until validated.
[[d1_databases]]
binding = "DB"
database_name = "urban-cowboy-content"
database_id = "0d09ca5a-74fe-4e83-a058-b8aa5fb21562"
migrations_dir = "migrations"
