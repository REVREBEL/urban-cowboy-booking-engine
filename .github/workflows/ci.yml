name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # Wrangler currently declares a newer optional workers-types peer than this
        # repository pins. Use the lockfile exactly while ignoring that optional peer
        # conflict; typecheck/build still validate the installed code.
        run: npm ci --legacy-peer-deps

      - name: Enforce shared control design system
        run: npm run lint:controls

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      # Vite proxies /api/* to Wrangler at 127.0.0.1:8787. Start it before
      # API-dependent tests so CI exercises the local backend, not a dead port.
      - name: Build
        run: npm run build

      - name: Start local Cloudflare Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/urban-cowboy-wrangler.log 2>&1 &
          echo $! > /tmp/urban-cowboy-wrangler.pid
          for attempt in $(seq 1 60); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/ || true)" != "000" ]; then
              echo "Local Worker is ready."
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/urban-cowboy-wrangler.pid)" 2>/dev/null; then
              cat /tmp/urban-cowboy-wrangler.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/urban-cowboy-wrangler.log
          echo "Timed out waiting for Wrangler to start." >&2
          exit 1

      - name: Test
        run: npm test

      - name: Validate D1 seed and foreign keys
        run: npm run test:seed

      - name: Validate D1 migrations (order, checksums, idempotency)
        run: |
          npm run test:migrate
          npm run d1:migrate:check

      - name: Stop local Cloudflare Worker
        if: always()
        run: |
          if [ -f /tmp/urban-cowboy-wrangler.pid ]; then
            kill "$(cat /tmp/urban-cowboy-wrangler.pid)" 2>/dev/null || true
          fi

      - name: Build Storybook
        id: storybook
        if: success() || failure()
        run: npm run build-storybook

      - name: Render every Storybook story in Chromium
        if: always() && steps.storybook.outcome == 'success'
        run: npm run test:storybook:runtime

      - name: Upload Storybook runtime failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-runtime-report
          path: storybook-runtime-report/
          if-no-files-found: ignore
          retention-days: 7
