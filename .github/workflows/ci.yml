name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # Wrangler currently declares a newer optional workers-types peer than this
        # repository pins. Use the lockfile exactly while ignoring that optional peer
        # conflict; typecheck/build still validate the installed code.
        run: npm ci --legacy-peer-deps

      - name: Enforce shared control design system
        run: npm run lint:controls

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        if: success() || failure()
        run: npm run build-storybook

      - name: Install Chromium for Storybook smoke tests
        if: success()
        run: npx playwright install --with-deps chromium

      - name: Render every Storybook story in Chromium
        if: success()
        run: npm run test:storybook:runtime

      - name: Upload Storybook runtime failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-runtime-report
          path: storybook-runtime-report/
          if-no-files-found: ignore
          retention-days: 7
