name: Component docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: component-docs
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # "/" is the explicit custom-domain root selector; unset uses the project path.
      DOCS_BASE_PATH: ${{ vars.DOCS_BASE_PATH || '/urban-cowboy-booking-engine' }}
    steps:
      # lint:controls diffs against origin/main, so the base ref must be present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Control contract
        run: npm run lint:controls

      - name: Validate component coverage matrix
        run: npm run test:docs

      - name: Verify generated inventory is current
        run: npm run docs:inventory:check

      - name: Verify generated design tokens are current
        run: npm run docs:tokens:check

      - name: Clean-checkout docs dev regression
        run: npm run test:docs:dev

      - name: Build static docs
        run: npm run docs:build

      - name: Smoke check static output
        run: npm run docs:smoke

      - name: Install Chromium for docs runtime smoke
        run: npx playwright install --with-deps chromium

      - name: Browser smoke under Pages base path
        run: npm run test:docs:runtime

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      DOCS_BASE_PATH: ${{ vars.DOCS_BASE_PATH || '/urban-cowboy-booking-engine' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static docs
        run: npm run docs:build

      - name: Smoke check static output
        run: npm run docs:smoke

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-app/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
