name: Update component library lockfile

on:
  push:
    branches:
      - chatgpt/merge-kept-component-library

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/merge-kept-component-library
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for retained component library"
          git push
