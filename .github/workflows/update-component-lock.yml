name: Update component dependency lockfile

on:
  push:
    branches:
      - chatgpt/prepare-kept-components-main
    paths:
      - package.json
      - .github/workflows/update-component-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/prepare-kept-components-main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit lockfile against latest branch head
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin chatgpt/prepare-kept-components-main
          git reset --hard origin/chatgpt/prepare-kept-components-main
          cp /tmp/package-lock.json package-lock.json
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for kept component dependencies"
          git push origin HEAD:chatgpt/prepare-kept-components-main
