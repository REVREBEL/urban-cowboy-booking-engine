name: Chromatic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # Keep dependency resolution identical to CI. Wrangler currently declares
        # a newer optional workers-types peer than this repository pins.
        run: npm ci --legacy-peer-deps

      - name: Run Chromatic
        # Token-enabled visual baselines run only from trusted main/workflow_dispatch
        # refs. Pull-request visual previews are handled by the Scry preview workflow.
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          externals: |
            public/**
            src/styles/**
            .storybook/**
          autoAcceptChanges: main
